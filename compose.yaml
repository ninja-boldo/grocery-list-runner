version: '3.8'

services:
  postgres-db:
    image: postgres:17-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maindb
    volumes:
      - postgres_data:/var/lib/postgresql/data

    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=192MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "wal_buffers=2MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - grocery-network
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    image: boldo42/grocery-list-vite
    container_name: grocery-app
    expose:
      - "4040"
      - "3030"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      RUNNING_IN_CONTAINER: "true"
    env_file:
      - .env
    networks:
      - grocery-network
    volumes:
      - ./maindb.sql:/app/maindb.sql:ro
      - ./models:/app/other/models
    deploy:
      resources:
        limits:
          memory: 384M
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3030/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts:/scripts:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./data:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - grocery-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/nginx-entrypoint.sh"]

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./scripts:/scripts:ro
      - ./data:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx
    entrypoint: ["/bin/sh", "/scripts/certbot-entrypoint.sh"]
    restart: unless-stopped


volumes:
  postgres_data:
  prometheus_data:

networks:
  grocery-network:
    driver: bridge
